name: Review Stack
# review-stack-control: runtime mirror rollout verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-stack:
    uses: madmoneymike5/review-stack-runtime/.github/workflows/review-stack.yml@e32b9fa29dbcf65a289c3fd066d42cd7cb2f094f
    with:
      native-command: >-
        corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @understory/core build && pnpm --filter @understory/core test && pnpm --filter @understory/server build && pnpm --filter @understory/server test && pnpm --filter @understory/web build
      opengrep-excludes: ""
      gitleaks-excludes: |-
        
